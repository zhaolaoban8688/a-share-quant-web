name: A股波段二次验证器 V1.1 数据快照

on:
  workflow_dispatch:
    inputs:
      max_stocks:
        description: 最大处理股票数（0=沪深主板全部；调试可填300）
        required: true
        default: "0"
  schedule:
    - cron: "40 7 * * 1-5"  # 北京时间工作日15:40左右

permissions:
  contents: write

concurrency:
  group: a-share-meta-validator-v11
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: 取出仓库代码
        uses: actions/checkout@v4

      - name: 配置 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install "akshare>=1.18.0" "pandas>=2.1" "numpy>=1.26" "requests>=2.31"

      - name: 生成二次验证全市场快照
        run: |
          python validator/build_snapshot.py --max-stocks "${{ github.event.inputs.max_stocks || '0' }}" --workers 28 --bars 180

      - name: 保存验证快照
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add validator/data/latest.json
          if git diff --cached --quiet; then
            echo "验证快照无变化"
          else
            git commit -m "validator V1.1 snapshot $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
          fi

      - name: 上传快照备份
        uses: actions/upload-artifact@v4
        with:
          name: meta-validator-v11-snapshot
          path: validator/data/latest.json
          retention-days: 14
